name: Build Velocity ISO

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'  # Monthly build

env:
  ISO_NAME: velocity-linux

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Clean up GitHub runner disk
      run: |
        # Free up maximum space on the 14GB runner
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /image
        sudo rm -rf /usr/local/share/powershell
        sudo rm -rf /usr/local/lib/node_modules
        sudo apt-get clean
        sudo apt-get autoremove -y
        sudo rm -rf /var/lib/apt/lists/*
        docker image prune -a -f
        echo "=== Available space after cleanup ==="
        df -h

    - name: Set file permissions
      run: |
        chmod 755 releng/airootfs/usr/share/backgrounds
        chmod 755 releng/airootfs/usr/share/backgrounds/velocity
        chmod 644 releng/airootfs/usr/share/backgrounds/velocity/default-wallpaper.jpg

    - name: Cache pacman and AUR packages
      uses: actions/cache@v4
      with:
        path: |
          /tmp/pipac-cache
          /var/cache/pacman/pkg
        key: ${{ runner.os }}-velocity-pacman-${{ hashFiles('installdeps-gh-runner.sh') }}

    - name: Build AUR packages
      run: |
        # Run archlinux container with privileged mode for mounting
        docker run --privileged --rm \
          -v "$(pwd):/workspace" \
          -w /workspace \
          archlinux:latest \
          /bin/bash -c "
            chmod +x *.sh
            /workspace/installdeps-gh-runner.sh
          "

    - name: Build ISO
      run: |
        docker run --privileged --rm \
          -v "$(pwd):/workspace" \
          -w /workspace \
          archlinux:latest \
          /bin/bash -c "
            chmod +x *.sh
            /workspace/buildiso-gh-runner.sh
          "

    - name: Get ISO info
      id: iso-info
      run: |
        # Debug: Check what files exist
        echo "=== Current directory ==="
        pwd
        echo "=== Looking for ISO files ==="
        find . -name "*.iso" -type f 2>/dev/null || echo "No ISO files found"
        echo "=== Checking ./out ==="
        ls -la out/ 2>/dev/null || echo "./out directory not found"
        cd out
        ISO_FILE=$(ls *.iso)
        ISO_SIZE=$(du -h $ISO_FILE | cut -f1)
        echo "iso_file=$ISO_FILE" >> $GITHUB_OUTPUT
        echo "iso_size=$ISO_SIZE" >> $GITHUB_OUTPUT
        echo "ISO: $ISO_FILE ($ISO_SIZE)"

    - name: Test ISO integrity
      run: |
        cd out
        ISO_FILE=$(ls *.iso)
        echo "=== Verifying ISO 9660 filesystem ==="
        file $ISO_FILE | grep "ISO 9660"
        echo "=== Checking ISO size ==="
        ISO_SIZE_BYTES=$(stat -c%s "$ISO_FILE")
        if [ $ISO_SIZE_BYTES -lt 500000000 ]; then
          echo "❌ ISO seems too small (<500MB)"
          exit 1
        fi
        echo "✅ ISO is $ISO_SIZE_BYTES bytes (>=500MB)"
        echo "=== Checking squashfs image ==="
        isoinfo -d -i "$ISO_FILE" | head -5
        echo "=== Computing checksum ==="
        sha256sum $ISO_FILE
        echo "✅ ISO integrity check passed"

    - name: Upload ISO artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ISO_NAME }}-${{ github.sha }}
        path: out/*.iso
        retention-days: 30

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: out/*.iso
        body: |
          Automated build of Velocity Linux

          **Build Details:**
          - Commit: ${{ github.sha }}
          - Triggered by: ${{ github.event_name }}
          - ISO Size: ${{ steps.iso-info.outputs.iso_size }}

          **Verification:**
          ```bash
          sha256sum ${{ steps.iso-info.outputs.iso_file }}
          ```
